<text x="35" y="1004" font-size="18" text-anchor="start" class="">Microphones</text>
<text x="200" y="1004" font-size="17" text-anchor="start" class="">A0–A4 read the MSGEQ7 band outputs. Direct microphone taps also reach D26–D30, unused by firmware 4.</text>
<text x="35" y="1044" font-size="18" text-anchor="start" class="">Power / return</text>
<text x="200" y="1044" font-size="17" text-anchor="start" class="">USB supplies MEGA_5V. Analogue reference: 5V. The Mega itself is the computing shield.</text>
<text x="35" y="1084" font-size="18" text-anchor="start" class="">Shared wiring</text>
<text x="200" y="1084" font-size="17" text-anchor="start" class="">Backplane GND/AGND bond; five RC voice cards; the same harness signals. Dynamixel communication uses the separate U2D2.</text>
<text x="35" y="1124" font-size="16" text-anchor="start" class="">Pin numbers are processor labels. Signal lines show conditioning along the route; connector positions are in the PCB drawings.</text>
