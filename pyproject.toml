[tool.ruff]
# Archived/pre-refactor code lives in "#"-prefixed folders and files
# (e.g. "colloquy/# threads/", "tests/# test2.py"). It's inert (can't be
# imported) and kept only as reference for the ongoing rebuild — leave it
# untouched by formatting and linting.
extend-exclude = ["**/#*"]

[tool.ruff.lint]
# Start narrow: only rules that are almost never a style choice, to avoid
# a wall of noise on a codebase that leans on dynamic dispatch
# (self["key"] = ..., __getitem__ lookups) that a stricter default ruleset
# would misread as errors.
select = [
    "F",   # pyflakes: unused imports/vars, undefined names, etc.
    "E9",  # syntax errors
]

[tool.mypy]
# Deliberately scoped, and deliberately not strict.
#
# The tree under colloquy/ is built on dynamic dispatch - self["name"] =
# child_or_callable, __getitem__ routing, snapshot() returning dicts
# whose payload *key* is the type. A checker has almost nothing true to
# say about that, and turning it loose repo-wide produces a wall of noise
# that gets silenced rather than fixed. Same reasoning as [tool.ruff]
# above, which is narrow for the same reason.
#
# So: only the pure-logic edges are listed in `files` - modules that take
# ordinary values and return ordinary values, where the confusions are
# real ones (degrees vs servo units, seconds vs bits, counts vs prose)
# and an annotation is worth reading. Annotating more of the tree is
# fine; adding it here is the decision.
#
# Run it with: py -m mypy   (mypy is a dev tool, not a runtime dep, so
# it is not in requirements.txt - `pip install mypy` to get it)
python_version = "3.14"
files = [
    "Source code/Python/colloquy/drivers/angle",
    "Source code/Python/colloquy/repository",
    "Source code/Python/colloquy/drivers/arduino/boards.py",
    "Source code/Python/colloquy/scenario_browser/rendering.py",
    # The audio table: body names in, pitches and band indices out, and
    # every one of its confusions is a real one - a pitch is not a band
    # index and a band index is not a module number, and all three are
    # small ints that read alike at a glance.
    "Source code/Python/colloquy/drivers/audio.py",
    # Paths in, an argv out. Which program gets run with which arguments
    # is the part of flashing worth being sure about, and none of it
    # needs a board.
    "Source code/Python/colloquy/drivers/arduino/flasher/toolchain.py",
    # The exposition schedule: dates and clock times in, days and a
    # yes/no out. Exactly the shape this list is for - a date is not a
    # datetime, a minute of the day is not a minute of an hour, and an
    # unset end date is a None that decides whether the piece may run at
    # all. The node itself (schedule/__init__.py) stays off, being an
    # ordinary tree node.
    "Source code/Python/colloquy/exposition/schedule/rules.py",
    "Source code/Python/colloquy/exposition/schedule/solver.py",
]
mypy_path = "Source code/Python"

# Without this, `files` only limits what is *reported as a heading* -
# mypy still follows every import out into the tree and reports what it
# finds there, which was 202 errors across 58 files on a first run of six.
# "silent" reads the imported modules for type information and says
# nothing about them, which is what scoping was supposed to mean.
follow_imports = "silent"

# The point of the exercise: an annotation that is wrong should fail,
# rather than sit there being read as documentation. `label: str = None`
# in rendering.py was exactly that, and is what prompted all of this.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# NOT set, on purpose: disallow_untyped_defs. These modules are not fully
# annotated and do not need to be - an unannotated helper beside an
# annotated one is not an error, it is just a helper nobody had a useful
# type for yet.

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Nothing to be done
# about it here, and it is not worth an error apiece.
module = ["serial.*", "yattag.*", "dynamixel_sdk.*", "markdown.*"]
ignore_missing_imports = true

[tool.vulture]
min_confidence = 80
paths = ["Source code/Python/colloquy"]
exclude = ["*/#*"]

[tool.pytest.ini_options]
# pythonpath makes "import colloquy" work without an installed package or
# a conftest.py sys.path hack, mirroring what main.py does manually.
pythonpath = ["Source code/Python"]
testpaths = ["Source code/Python/pytest_tests"]

[tool.coverage.run]
# "#"-prefixed paths are archived/inert (see [tool.ruff] above) and
# can't be imported, so they'd never show up in coverage anyway - this
# just keeps report noise down.
omit = ["**/#*/**", "**/__pycache__/**"]
